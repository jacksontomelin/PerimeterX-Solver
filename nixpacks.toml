[phases.setup]
aptPkgs = [
    "libnss3",
    "libnspr4",
    "libdbus-1-3",
    "libatk1.0-0",
    "libatk-bridge2.0-0",
    "libcups2",
    "libdrm2",
    "libxkbcommon0",
    "libatspi2.0-0",
    "libxcomposite1",
    "libxdamage1",
    "libxfixes3",
    "libxrandr2",
    "libgbm1",
    "libpango-1.0-0",
    "libcairo2",
    "libasound2",
    "libx11-xcb1"
]

[phases.install]
cmds = [
    "pip install -r requirements.txt",
    "playwright install --with-deps chromium"
]

[start]
cmd = "python solve.py"

[variables]
PORT = "3000"
